name: DomeWatch Projected Calendar

on:
  schedule:
    - cron: '0 1 * * *'   # ~9 PM ET (approximate around DST transitions), every day
    - cron: '0 13 * * *'  # ~9 AM ET (approximate around DST transitions), every day
  workflow_dispatch:

jobs:
  fetch-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright

      - name: Install Chromium
        run: playwright install chromium

      - name: Fetch DomeWatch projected calendar
        run: python fetch_domewatch_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add domewatch_calendar.json
          git diff --cached --quiet || git commit -m "Update DomeWatch projected calendar $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
