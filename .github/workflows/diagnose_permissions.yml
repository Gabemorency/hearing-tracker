name: Diagnose workflow-dispatch permission fix

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Test createWorkflowDispatch with actions:write permission
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nightly.yml',
              ref: 'main'
            })
            console.log("SUCCESS: createWorkflowDispatch did not throw")
