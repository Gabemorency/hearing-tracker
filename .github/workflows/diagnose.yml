name: Diagnose Link Coverage

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright beautifulsoup4 lxml pdfplumber requests

      - name: Install Chromium
        run: playwright install chromium

      - name: Run diagnostic
        run: python diagnose_link_coverage.py
